name: Sync dynamic content to CloudBase

on:
  push:
    branches: [main]
    paths:
      - 'site/data/**'
      - 'site/assets/posters/**'

permissions:
  contents: read

concurrency:
  group: cloudbase-content
  cancel-in-progress: true

jobs:
  sync-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read CloudBase environment
        id: env
        shell: bash
        run: |
          ENV_ID=$(node -p "require('./.deploy/cloudbase.json').envId")
          echo "env_id=$ENV_ID" >> "$GITHUB_OUTPUT"

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Check CloudBase credentials
        shell: bash
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: |
          test -n "$TCB_SECRET_ID" || { echo "TCB_SECRET_ID is missing"; exit 1; }
          test -n "$TCB_SECRET_KEY" || { echo "TCB_SECRET_KEY is missing"; exit 1; }

      - name: Login CloudBase
        run: timeout 90s tcb login --apiKeyId "${{ secrets.TCB_SECRET_ID }}" --apiKey "${{ secrets.TCB_SECRET_KEY }}"

      - name: Sync event data
        run: tcb hosting deploy site/data /data -e "${{ steps.env.outputs.env_id }}"

      - name: Sync competition posters
        run: tcb hosting deploy site/assets/posters /assets/posters -e "${{ steps.env.outputs.env_id }}"
