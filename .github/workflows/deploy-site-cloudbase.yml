name: Release site to CloudBase

on:
  push:
    branches: [main]
    paths:
      - '.deploy/release.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudbase-production-v2
  cancel-in-progress: true

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project
        run: |
          node tools/verify.js
          node tools/build-mp-data.js
          node tools/verify.js

      - name: Read CloudBase environment
        id: env
        shell: bash
        run: |
          ENV_ID=$(node -p "require('./.deploy/cloudbase.json').envId")
          echo "env_id=$ENV_ID" >> "$GITHUB_OUTPUT"

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login CloudBase
        run: timeout 90s tcb login --apiKeyId "${{ secrets.TCB_SECRET_ID }}" --apiKey "${{ secrets.TCB_SECRET_KEY }}"

      - name: Deploy complete site
        run: tcb hosting deploy site / -e "${{ steps.env.outputs.env_id }}"

      - name: Deployment summary
        run: |
          echo "CloudBase environment: ${{ steps.env.outputs.env_id }}"
          echo "Release trigger: ${{ github.sha }}"
