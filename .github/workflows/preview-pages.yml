name: Deploy interaction preview

on:
  push:
    branches: [main]
    paths:
      - 'site-v2/**'
      - 'site/data/events.json'
      - '.github/workflows/preview-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Sync current content into preview
        run: cp site/data/events.json site-v2/data/events.json

      - name: Upload preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-v2

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4

