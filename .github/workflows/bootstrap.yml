name: Bootstrap full project

on:
  push:
    paths:
      - "bootstrap/READY"

permissions:
  contents: write

jobs:
  import-project:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct project archive from Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f /tmp/future-zaowu-core.zip
          for SHA in \
            ef7e50e94d02c1a5ffed0915017936f5662a3cf6 \
            ff5403ee0c4332c9119bdd613255e1b3dfb95f3d \
            f72703c8afa502ec6b4b121bbf5a037bf33c1d73 \
            f4a2b86a9e66365e32a51469c8d5458dabc2f7c6 \
            e8459481fcbf65a5ca2d2a55982ec05aa1b4610e \
            a2c5caeac2eead70f24c8f6a106ccc64a945c109
          do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${SHA}" --jq '.content' | tr -d '\n' | base64 -d >> /tmp/future-zaowu-core.zip
          done
          rm -rf /tmp/future-zaowu-core
          mkdir -p /tmp/future-zaowu-core
          unzip -q /tmp/future-zaowu-core.zip -d /tmp/future-zaowu-core
          cp -a /tmp/future-zaowu-core/. .

      - name: Verify imported project
        run: |
          node tools/verify.js
          node tools/build-mp-data.js
          node tools/verify.js

      - name: Commit imported project
        run: |
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Import complete Future Zaowu Arena project"
            git push
          fi
