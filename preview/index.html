<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>未来造物赛场 · 交互预览</title><style>
:root{--ink:#15171b;--muted:#777b84;--line:rgba(20,25,35,.08);--blue:#0a84ff;--red:#ff514b;--glass:rgba(255,255,255,.68)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',Arial,sans-serif;color:var(--ink)}body{background:radial-gradient(circle at 15% 10%,rgba(114,163,255,.18),transparent 30%),radial-gradient(circle at 85% 12%,rgba(151,120,255,.14),transparent 28%),#e9ebef}.shell{width:min(430px,100vw);min-height:100vh;margin:auto;position:relative;background:rgba(246,247,249,.52);backdrop-filter:blur(28px);overflow:hidden}@media(min-width:700px){body{padding:28px 0}.shell{min-height:880px;border-radius:42px;box-shadow:0 24px 70px rgba(30,40,60,.15)}}.top{padding:22px 20px 10px;position:sticky;top:0;z-index:20;background:linear-gradient(to bottom,rgba(245,247,250,.94),rgba(245,247,250,.68),transparent)}.brand{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:650}.mark{display:flex;align-items:center;gap:10px}.logo{width:25px;height:25px;border-radius:9px;background:conic-gradient(#0a84ff,#8069ff,#ffc06e,#0a84ff);box-shadow:inset 0 0 0 7px rgba(255,255,255,.75)}.live{font:11px ui-monospace,monospace;color:var(--muted);padding:7px 9px;border-radius:999px;background:rgba(255,255,255,.75)}.hero{padding:10px 20px 18px;position:relative}.hero h1{font-size:36px;line-height:1.05;letter-spacing:-1.5px;margin:16px 0 10px}.hero h1 span{background:linear-gradient(90deg,#0a84ff,#7867ff);-webkit-background-clip:text;color:transparent}.hero p{font-size:13px;color:var(--muted);line-height:1.65;max-width:320px}.orb{position:absolute;right:-16px;top:8px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(126,171,255,.6) 30%,rgba(125,92,255,.12) 65%,transparent 70%);filter:drop-shadow(0 20px 30px rgba(72,95,170,.15));animation:float 5s ease-in-out infinite}@keyframes float{50%{transform:translate(-8px,10px) scale(1.05)}}.ticker{margin:0 20px 14px;border-radius:16px;background:var(--glass);border:1px solid rgba(255,255,255,.75);overflow:hidden}.toptick{display:flex;align-items:center;gap:8px;padding:10px 12px 7px;font-size:11px;color:var(--muted)}.ping{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(255,81,75,.35);animation:pulse 1.7s infinite}@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,81,75,0)}}.marquee{white-space:nowrap;overflow:hidden;border-top:1px solid var(--line);padding:10px 0;font-size:12px;color:#555b64}.track{display:inline-block;padding-left:100%;animation:marquee 22s linear infinite}.track span{margin-right:32px}@keyframes marquee{to{transform:translateX(-100%)}}.tools{padding:0 20px 8px}.search{height:44px;border-radius:14px;background:rgba(255,255,255,.7);display:flex;align-items:center;gap:8px;padding:0 13px}.search input{flex:1;border:0;outline:0;background:transparent;font-size:14px}.chips{display:flex;gap:8px;overflow:auto;padding:12px 0 3px}.chip{border:0;background:rgba(122,126,136,.1);padding:9px 13px;border-radius:999px;white-space:nowrap;font-size:12px;color:#666b73}.chip.on{background:#17191d;color:#fff}.head{padding:14px 20px 10px;display:flex;justify-content:space-between;align-items:center}.head h2{font-size:17px;margin:0}.head button{border:0;background:transparent;color:var(--muted);font-size:12px}.deck{padding:0 20px 110px;display:grid;gap:15px}.card{border-radius:22px;overflow:hidden;background:rgba(255,255,255,.67);border:1px solid rgba(255,255,255,.75);box-shadow:0 14px 38px rgba(36,46,67,.08);cursor:pointer;transform-style:preserve-3d;transition:.22s}.card:active{transform:scale(.985)}.cover{height:182px;position:relative;overflow:hidden;padding:16px;background:linear-gradient(150deg,#f7f9fc,#d2dce9)}.card:nth-child(2) .cover{background:linear-gradient(150deg,#f8f5ef,#ddd3c4)}.card:nth-child(3) .cover{background:linear-gradient(150deg,#f4f7f9,#c9d9dc)}.card:nth-child(4) .cover{background:linear-gradient(150deg,#f6f5fb,#d1caec)}.blob{position:absolute;width:170px;height:170px;border-radius:38% 62% 55% 45%;right:-46px;bottom:-58px;background:linear-gradient(135deg,rgba(10,132,255,.20),rgba(126,89,255,.08));transform:rotate(24deg)}.deadline{position:relative;z-index:2;display:flex;justify-content:space-between;font:11px ui-monospace,monospace;color:#666d76}.badge{padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.76);color:#23804e}.badge.hot{background:var(--red);color:#fff}.ctitle{position:absolute;left:16px;right:16px;bottom:16px;z-index:2}.ctitle h3{font-size:22px;line-height:1.18;letter-spacing:-.7px;margin:0 0 6px;max-width:300px}.ctitle p{font-size:11.5px;color:#6c7178;margin:0}.body{padding:14px 15px 16px}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;padding:5px 7px;border-radius:7px;background:rgba(112,118,128,.09);color:#666b74}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:#626873}.arrow{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(20,22,26,.06)}.radar{display:none;margin:0 20px 110px;min-height:420px;border-radius:22px;background:rgba(255,255,255,.65);position:relative;overflow:hidden}.radar.show{display:block}.ring{position:absolute;border:1px solid rgba(20,30,50,.08);border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.r1{width:120px;height:120px}.r2{width:240px;height:240px}.r3{width:360px;height:360px}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:#15171b;color:#fff;display:grid;place-items:center;text-align:center;font-size:10px}.point{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 6px rgba(10,132,255,.10);border:2px solid white}.hotp{background:var(--red)}.p1{left:24%;top:35%}.p2{left:69%;top:29%}.p3{left:62%;top:67%}.p4{left:31%;top:73%}.p5{left:47%;top:20%}.bottom{position:absolute;left:14px;right:14px;bottom:12px;height:68px;border-radius:22px;background:rgba(255,255,255,.78);backdrop-filter:blur(24px);display:flex;z-index:30}.nav{flex:1;border:0;background:transparent;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;color:#868a92;font-size:10px}.nav i{font-size:18px;font-style:normal}.nav.on{color:#15171b}.sheet{position:absolute;inset:0;z-index:50;background:rgba(244,246,249,.98);transform:translateY(102%);transition:.48s cubic-bezier(.22,.85,.24,1);display:flex;flex-direction:column}.sheet.open{transform:none}.shero{height:310px;background:linear-gradient(150deg,#f6f8fb,#cedaea);position:relative;padding:18px;overflow:hidden}.shero:after{content:'';position:absolute;width:250px;height:250px;right:-60px;top:70px;border-radius:42% 58% 62% 38%;background:linear-gradient(135deg,rgba(8,132,255,.22),rgba(137,104,255,.08));transform:rotate(30deg)}.sbar{display:flex;justify-content:space-between;position:relative;z-index:2}.circle{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.84);font-size:18px}.stitle{position:absolute;left:22px;right:22px;bottom:24px;z-index:2}.stitle small{font:11px ui-monospace,monospace;color:#666c76}.stitle h2{font-size:30px;line-height:1.06;letter-spacing:-1px;margin:8px 0}.stitle p{font-size:12px;color:#666c74}.sbody{flex:1;overflow:auto;padding:18px 20px 110px}.count{border-radius:20px;background:rgba(255,255,255,.8);padding:17px;display:flex;justify-content:space-between;align-items:end}.count small{color:var(--muted)}.count .n{font:28px ui-monospace,monospace;margin-top:6px}.pill{font-size:11px;background:var(--red);color:#fff;padding:7px 9px;border-radius:999px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.metric{border-radius:17px;background:rgba(255,255,255,.74);padding:14px}.metric small{color:var(--muted)}.metric strong{display:block;margin-top:7px;font-size:14px}.block{margin-top:18px}.block h4{font-size:12px;color:var(--muted);margin:0 0 8px}.block p{font-size:14px;line-height:1.75;color:#4f555f;margin:0}.actions{position:absolute;left:15px;right:15px;bottom:14px;display:flex;gap:10px}.actions button{height:52px;border:0;border-radius:15px;font-size:15px}.fav{width:112px;background:#fff}.join{flex:1;background:#111317;color:#fff}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class='shell'>
<div class='top'><div class='brand'><div class='mark'><div class='logo'></div>未来造物赛场</div><div class='live'>LIVE · 9 场</div></div></div>
<section><div class='hero'><div class='orb'></div><h1>找到你的<br><span>下一场比赛</span></h1><p>不是赛事目录，是一个持续扫描中国区 AI 机会的探索器。</p></div>
<div class='ticker'><div class='toptick'><span class='ping'></span>赛事情报流 · 刚刚更新</div><div class='marquee'><div class='track'><span>第七届中国人工智能大赛 · 10.18 截止</span><span>江苏 AI+科学黑客松 · 明日中午截止</span><span>开放原子创新赛 · 总奖池 100 万</span></div></div></div>
<div class='tools'><div class='search'>⌕ <input id='q' placeholder='搜索赛事 / 主办方 / 方向'></div><div class='chips' id='chips'><button class='chip on' data-f='全部'>全部</button><button class='chip' data-f='青少年'>青少年</button><button class='chip' data-f='高校'>高校</button><button class='chip' data-f='开发者'>开发者</button><button class='chip' data-f='线下'>线下</button></div></div>
<div class='head'><h2>正在发生</h2><button id='toggle'>切到雷达视图 ↗</button></div><div class='deck' id='deck'></div>
<div class='radar' id='radar'><div class='ring r1'></div><div class='ring r2'></div><div class='ring r3'></div><div class='center'>未来<br>造物</div><span class='point hotp p1'></span><span class='point p2'></span><span class='point p3'></span><span class='point p4'></span><span class='point p5'></span></div></section>
<nav class='bottom'><button class='nav on'><i>◉</i>探索</button><button class='nav'><i>⌁</i>时讯</button><button class='nav'><i>◇</i>收藏</button><button class='nav'><i>◌</i>我的</button></nav>
<div class='sheet' id='sheet'><div class='shero'><div class='sbar'><button class='circle' id='close'>←</button><button class='circle' id='share'>⇧</button></div><div class='stitle'><small>AI COMPETITION</small><h2 id='dt'></h2><p id='do'></p></div></div><div class='sbody'><div class='count'><div><small>距离报名截止</small><div class='n' id='dd'></div></div><div class='pill'>临近截止</div></div><div class='grid'><div class='metric'><small>适合人群</small><strong id='da'></strong></div><div class='metric'><small>举办方式</small><strong id='dm'></strong></div><div class='metric'><small>城市</small><strong id='dc'></strong></div><div class='metric'><small>权益</small><strong id='dp'></strong></div></div><div class='block'><h4>为什么值得看</h4><p id='dw'></p></div><div class='block'><h4>主办方</h4><p id='dorg'></p></div></div><div class='actions'><button class='fav' id='fav'>收藏</button><button class='join'>查看官方报名页 ↗</button></div></div>
</div><script>
const E=[
{id:1,t:'第七届中国人工智能大赛',o:'中国人工智能大赛组委会',c:'厦门',m:'线上 + 场景',a:'企业 / 高校 / 科研',p:'官方赛题权益',d:'2026-10-18',g:'开发者',tags:['大模型','具身智能','智能体'],w:'不是单纯拼模型分数，而是能看到产业真正把 AI 放到哪些真实问题里。'},
{id:2,t:'2026 江苏省高校 AI+科学与工程黑客松',o:'江苏高校联合赛事',c:'江苏',m:'线下决赛',a:'高校学生',p:'作品实践',d:'2026-10-10',g:'高校',tags:['AI for Science','Agent','工程实践'],w:'强调可运行、可验证和证据链，比只交 PPT 更接近真实项目能力。'},
{id:3,t:'WTCC 2026 · Hack for Life',o:'BuilderLab / WTCC',c:'上海',m:'线下 4 天',a:'开发者 / Maker',p:'产品原型',d:'2026-10-17',g:'开发者',tags:['AI × 硬件','产品原型','真实场景'],w:'从生活观察出发，4 天内做出真的能工作的东西，和未来造物的方法非常接近。'},
{id:4,t:'2026 中小学智能未来邀请赛',o:'智能未来邀请赛组委会',c:'北京等',m:'线上 + 线下',a:'中小学生',p:'青少年赛道',d:'2026-11-20',g:'青少年',tags:['AIGC','AI 创新实践','智能算法'],w:'真正适合中小学生年龄层，不只看奖项，更看孩子能不能独立解释问题、过程和作品。'}];let f='全部',rad=false,cur=null;const deck=document.getElementById('deck'),q=document.getElementById('q'),sheet=document.getElementById('sheet'),favs=new Set();function left(d){return Math.ceil((new Date(d+'T23:59:00')-new Date())/86400000)}function render(){const s=q.value.trim().toLowerCase();const L=E.filter(e=>(f==='全部'||e.g===f||e.m.includes(f))&&(!s||(e.t+e.o+e.c+e.tags.join(' ')).toLowerCase().includes(s)));deck.innerHTML=L.map(e=>{const x=left(e.d);return `<article class='card' data-id='${e.id}'><div class='cover'><div class='blob'></div><div class='deadline'><span>DEADLINE · ${e.d.slice(5).replace('-','.')}</span><span class='badge ${x<=7?'hot':''}'>${x<=0?'已截止':x<=7?'剩 '+x+' 天':'报名中'}</span></div><div class='ctitle'><h3>${e.t}</h3><p>${e.o}</p></div></div><div class='body'><div class='tags'>${e.tags.map(t=>`<span class='tag'>${t}</span>`).join('')}</div><div class='meta'><span><b>${e.c}</b> · ${e.m}</span><span class='arrow'>→</span></div></div></article>`}).join('');deck.querySelectorAll('.card').forEach(c=>{c.onclick=()=>openD(+c.dataset.id);c.onpointermove=e=>{if(matchMedia('(hover:hover)').matches){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(800px) rotateX(${-y*3}deg) rotateY(${x*4}deg) translateY(-2px)`}};c.onpointerleave=()=>c.style.transform=''})}function openD(id){cur=E.find(e=>e.id===id);if(!cur)return;dt.textContent=cur.t;do.textContent=cur.o+' · '+cur.c;da.textContent=cur.a;dm.textContent=cur.m;dc.textContent=cur.c;dp.textContent=cur.p;dw.textContent=cur.w;dorg.textContent=cur.o+'。正式版这里会接主办方简介、官网和联系方式。';dd.textContent=left(cur.d)>0?left(cur.d)+' 天':'已截止';fav.textContent=favs.has(id)?'已收藏':'收藏';sheet.classList.add('open')}close.onclick=()=>sheet.classList.remove('open');fav.onclick=()=>{if(!cur)return;favs.has(cur.id)?favs.delete(cur.id):favs.add(cur.id);fav.textContent=favs.has(cur.id)?'已收藏':'收藏'};share.onclick=()=>alert('正式版这里会调用系统分享，并生成赛事独立链接');chips.onclick=e=>{const b=e.target.closest('.chip');if(!b)return;f=b.dataset.f;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));render()};q.oninput=render;toggle.onclick=()=>{rad=!rad;deck.style.display=rad?'none':'grid';radar.classList.toggle('show',rad);toggle.textContent=rad?'返回卡片视图 ↙':'切到雷达视图 ↗'};document.querySelectorAll('.nav').forEach((n,i)=>n.onclick=()=>{document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));n.classList.add('on');if(i)alert('这份预览先重点演示“探索”页，正式版再把时讯 / 收藏 / 我的做到同等级交互。')});render();
</script></body></html>
